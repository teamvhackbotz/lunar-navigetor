<!-- ==========================================================================
     Lunar Landing Site Navigator - High-Resolution Site Inspector Modal & HUD
     File: components/inspection_modal/inspection_modal.html
     Role: Expands candidate site visualizations into an interactive, high-precision
           workspace with fine-grained azimuth grids, crosshairs, and slope analyses.
           Supports Centered Modal (default) and Draggable Floating HUD modes.
     ========================================================================== -->

<!-- Outer overlay wrapper. Switches between .mode-modal and .mode-hud -->
<div class="site-inspector-overlay mode-modal" id="site-inspector-overlay" style="display: none;">
  <!-- Centered / Draggable Dialog Window -->
  <div class="site-inspector-dialog" id="site-inspector-dialog" role="dialog" aria-modal="true" aria-labelledby="inspector-site-name">

    <!-- Draggable Header Row -->
    <div class="inspector-header" id="inspector-drag-handle">
      <div class="inspector-title-group">
        <span class="inspector-badge" id="inspector-site-tag">Artemis III</span>
        <div class="inspector-heading-wrap">
          <h3 class="inspector-site-name" id="inspector-site-name">Peak Near Shackleton</h3>
          <span class="inspector-site-coords" id="inspector-site-coords">89.6° S · 129.2° E · +1,240 m</span>
        </div>
      </div>

      <div class="inspector-header-actions">
        <!-- Quick-toggle between Centered Modal and Floating HUD -->
        <button class="btn-inspector-header" id="btn-inspector-mode-toggle" title="Toggle between Centered Modal and Floating HUD">
          <span id="inspector-mode-icon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </span>
          <span id="inspector-mode-label">Float HUD</span>
        </button>
        <!-- Close button -->
        <button class="btn-inspector-close" id="btn-inspector-close" title="Close Inspector" aria-label="Close">&times;</button>
      </div>
    </div>

    <!-- View Switcher Tabs -->
    <div class="inspector-tabs-nav">
      <button class="inspector-tab-btn active" data-tab="horizon">
        <svg class="tab-svg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
        <span>360° Skyline Mask</span>
      </button>
      <button class="inspector-tab-btn" data-tab="slope">
        <svg class="tab-svg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
        <span>Crater Slope Profile</span>
      </button>
      <button class="inspector-tab-btn" data-tab="solar">
        <svg class="tab-svg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <span>Solar Stay Window</span>
      </button>
      <button class="inspector-tab-btn" data-tab="comms">
        <svg class="tab-svg-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
        <span>Direct-to-Earth Comms</span>
      </button>
    </div>

    <!-- Primary Visualization Stage -->
    <div class="inspector-stage" id="inspector-stage">
      <!-- Populated dynamically by inspection_modal.js based on active tab -->
    </div>

    <!-- Telemetry Status & Action Footer -->
    <div class="inspector-footer">
      <div class="inspector-telemetry-status" id="inspector-telemetry-status">
        <span class="telemetry-pill pill-ok" id="inspector-los-pill">✓ Line of Sight Maintained</span>
        <span class="telemetry-detail" id="inspector-clearance-detail">Terrain clearance: <strong>+2.4°</strong> above eastern rim peaks</span>
      </div>

      <div class="inspector-footer-actions">
        <button class="btn-inspector-action" id="btn-inspector-copy-coords" title="Copy coordinate telemetry to clipboard">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Copy Coords</span>
        </button>
        <button class="btn-inspector-action btn-primary" id="btn-inspector-focus-3d" title="Center 3D Moon camera on site">
          <svg class="btn-focus-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>
          <span>Focus 3D Viewport</span>
        </button>
      </div>
    </div>

  </div>
</div>
