
<div id="lunar-timeline" class="lt-root">

  <!-- TOP TOOLBAR -->
  <div class="lt-toolbar">

    <div class="lt-playback">
      <button id="lt-prev" class="lt-icon-btn" title="Previous interval">|◀</button>
      <button id="lt-play" class="lt-play-btn" title="Play">▶</button>
      <button id="lt-next" class="lt-icon-btn" title="Next interval">▶|</button>
    </div>

    <div class="lt-speed">
      <span>Speed:</span>
      <button class="lt-speed-btn active" data-speed="100">100×</button>
      <button class="lt-speed-btn" data-speed="1000">1000×</button>
    </div>

    <button id="lt-edit" class="lt-edit-btn" title="Edit timeline">
      <span>✎</span> Edit
    </button>

    <div class="lt-toolbar-spacer"></div>

    <div class="lt-information">
      <span class="lt-info-item lt-clock">
        <span class="lt-info-icon">◷</span>
        <strong id="lt-current-time">Loading time...</strong>
      </span>

      <span class="lt-info-item lt-location">
        <span class="lt-info-icon">📍</span>
        <strong>Connecting Ridge</strong>
        <span>·</span>
        <span>89.40° S</span>
        <span>·</span>
        <span>222.6° E</span>
      </span>

      <span class="lt-info-item lt-daylight">
        <span>☀</span>
        <strong>Polar Day</strong>
      </span>
    </div>
  </div>

  <!-- EDIT PANEL -->
  <div id="lt-edit-panel" class="lt-edit-panel" hidden>
    <div class="lt-edit-field">
      <label for="lt-date-input">Current UTC date and time</label>
      <input type="datetime-local" id="lt-date-input">
    </div>

    <div class="lt-edit-field">
      <label for="lt-window-input">Timeline window</label>
      <select id="lt-window-input">
        <option value="7">7 days</option>
        <option value="14">14 days</option>
        <option value="30" selected>30 days</option>
        <option value="60">60 days</option>
        <option value="90">90 days</option>
      </select>
    </div>

    <button id="lt-apply-edit">Apply</button>
    <button id="lt-cancel-edit">Cancel</button>
  </div>

  <!-- TIMELINE INFORMATION -->
  <div class="lt-ruler-header">

    <div class="lt-range-start" id="lt-range-start">
      --
    </div>

    <div class="lt-window-info">
      <span class="lt-rocket">🚀</span>
      <strong>Window (<span id="lt-window-days">30</span>d)</strong>
      <span>·</span>
      <span>Mid:</span>
      <strong id="lt-mid-date">--</strong>
    </div>

    <div class="lt-interval-info">
      <span>◷</span>
      <select id="lt-interval">
        <option value="1.5" selected>1.5h interval</option>
        <option value="1">1h interval</option>
        <option value="3">3h interval</option>
        <option value="6">6h interval</option>
        <option value="12">12h interval</option>
        <option value="24">24h interval</option>
      </select>
    </div>

    <div class="lt-range-end" id="lt-range-end">
      --
    </div>

  </div>

  <!-- TIMELINE RULER -->
  <div class="lt-ruler-container">

    <div class="lt-ruler" id="lt-ruler">

      <div class="lt-ruler-ticks" id="lt-ruler-ticks"></div>

      <div class="lt-current-marker" id="lt-current-marker">
        <div class="lt-marker-line"></div>
        <div class="lt-marker-dot"></div>
      </div>

    </div>

  </div>

</div>

<script src="timeline.js"></script>
