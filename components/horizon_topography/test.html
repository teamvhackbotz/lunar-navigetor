<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mission Planner & GIS Overlays - Standalone Test Harness</title>
  <!-- Global design system styles -->
  <link rel="stylesheet" href="../../styles.css">
  <!-- Active operational theme stylesheet -->
  <link rel="stylesheet" id="theme-stylesheet" href="../../themes/theme_earth.css">
  <!-- Horizon / Mission drawers component styles -->
  <link rel="stylesheet" href="horizon_topography.css">
  <!-- Shared Theme Manager -->
  <script src="../../themes/theme_manager.js"></script>
  <style>
    body { background: var(--bg-deep-space, #141618); margin: 0; padding: 20px; font-family: sans-serif; color: var(--text-primary, #ede8e1); height: 100vh; overflow: hidden; }
    .test-banner { max-width: 600px; margin: 20px auto; text-align: center; }
  </style>
</head>
<body class="theme-earth">

  <!-- Checkboxes for pure CSS drawer toggling -->
  <input type="checkbox" id="toggle-left-horizon" class="drawer-toggle">
  <input type="checkbox" id="toggle-right-horizon" class="drawer-toggle">

  <div class="test-banner">
    <h2 style="font-size: 18px; margin-bottom: 6px;">Mission Planner & GIS Overlays Test Harness</h2>
    <p style="font-size: 13px; color: var(--text-muted, #8c867c); margin-bottom: 20px;">
      Click the screen edge handles on the <strong>Left</strong> (<code>[ 🧭 Mission & Traverse ]</code>) and <strong>Right</strong> (<code>[ 🗺️ GIS Overlays ]</code>) to slide open each global analytical tool.
    </p>

    <!-- Test Trigger Buttons -->
    <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
      <label for="toggle-left-horizon" style="padding: 8px 14px; background: var(--bg-surface-dark, #1e2022); border: 1px solid var(--border-subtle, #3a3c3f); border-radius: 4px; font-size: 12px; cursor: pointer;">
        Toggle Left Planner
      </label>
      <label for="toggle-right-horizon" style="padding: 8px 14px; background: var(--bg-surface-dark, #1e2022); border: 1px solid var(--border-subtle, #3a3c3f); border-radius: 4px; font-size: 12px; cursor: pointer;">
        Toggle Right Overlays
      </label>
    </div>

    <!-- Real-time EventBus logging console -->
    <div id="event-log" style="margin-top:20px; padding:15px; background:var(--bg-surface-dark, #1e2022); border:1px solid var(--border-subtle, #3a3c3f); border-radius:6px; font-family:monospace; font-size:12px; color:var(--text-secondary, #beb7ac); text-align: left;">
      <strong>Event Bus Output:</strong>
      <ul id="log-list" style="margin:8px 0 0; padding-left:20px; max-height: 160px; overflow-y: auto;">
        <li>Listening for drawer events...</li>
      </ul>
    </div>
  </div>

  <!-- Micro-frontend mount container -->
  <div id="mount-horizon-topography"></div>

  <!-- Shared core event bus and math dependencies -->
  <script src="../../core/event_bus.js"></script>
  <script src="../../core/coord_math.js"></script>
  <script>
    const logList = document.getElementById("log-list");
    function logEvent(name, data) {
      const li = document.createElement("li");
      li.textContent = `[${new Date().toLocaleTimeString()}] ${name}: ${JSON.stringify(data)}`;
      logList.prepend(li);
    }

    if (window.eventBus) {
      window.eventBus.on("traverse:waypoint_select", d => logEvent("traverse:waypoint_select", d));
      window.eventBus.on("mission:constraint_change", d => logEvent("mission:constraint_change", d));
      window.eventBus.on("layer:basemap_change", d => logEvent("layer:basemap_change", d));
      window.eventBus.on("layer:toggle", d => logEvent("layer:toggle", d));
      window.eventBus.on("layer:opacity", d => logEvent("layer:opacity", d));
      window.eventBus.on("site:marked", d => logEvent("site:marked", d));
    }

    // Asynchronously fetch and inject the component markup and script for isolated testing
    fetch("horizon_topography.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("mount-horizon-topography").innerHTML = html;
        const script = document.createElement("script");
        script.src = "horizon_topography.js";
        document.body.appendChild(script);
      });
  </script>
</body>
</html>
