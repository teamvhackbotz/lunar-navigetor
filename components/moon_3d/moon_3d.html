<!-- ==========================================================================
     COMPONENT: Three.js 3D Moon Viewport (components/moon_3d/)
     TEMPLATE: moon_3d.html
     
     ROLE:
     The central 3D stage of the Lunar Landing Site Navigator cockpit:
     - Mounts an interactive Three.js WebGL canvas rendering a 3D Moon sphere.
     - Textured with authentic NASA LROC global lunar albedo imagery.
     - Supports free rotation, zoom, dynamic timeline-driven solar illumination,
       click-to-mark raycasting, and cross-view surface-distance measurements.
     ========================================================================== -->

<!-- Main Viewport Shell: Occupies full central stage between top nav (54px) and bottom cockpit (92px) -->
<main class="main-viewport" id="moon-3d-viewport" aria-label="3D Lunar Surface Viewport">
  <div class="viewport-stage" id="viewport-stage">
    
    <!-- Three.js WebGL Canvas Mount: moon_3d.js injects the WebGLRenderer <canvas> here -->
    <div id="moon-webgl-canvas" class="moon-webgl-canvas" aria-label="Interactive 3D Moon Canvas" title="Shift + right-click two marked sites to select a pair; right-click either and choose Measure distance"></div>

    <!-- 2D Surface Pin Overlay (Fallback/HTML Tooltip synced with 3D pin) -->
    <div class="surface-pin" id="active-moon-pin" style="display: none;" aria-live="polite">
      <span class="pin-marker"></span>
      <span class="pin-label">Connecting Ridge</span>
    </div>

    <!-- 8K / 4K Clarity HUD Control Deck -->
    <div class="moon-clarity-hud" id="moon-clarity-hud" aria-label="3D Texture Clarity Controls">
      <div class="clarity-status-pill" id="hud-clarity-status" title="Active Texture Layer: NASA LROC 8K Ultra-High Definition">
        <span class="hud-status-dot pulse"></span>
        <span class="hud-status-text" id="hud-res-text">8K ULTRA-HD</span>
      </div>
      <div class="clarity-switcher-group" role="group" aria-label="Texture Resolution Selector">
        <button type="button" class="hud-pill-btn" data-res="4k" title="Switch to 4K High Resolution (4096×2048)">4K HD</button>
        <button type="button" class="hud-pill-btn active" data-res="8k" title="Switch to 8K Ultra-High Resolution (8192×4096)">8K UHD</button>
      </div>
    </div>

  </div>
</main>
