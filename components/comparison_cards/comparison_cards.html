<!-- ==========================================================================
     Lunar Landing Site Navigator - Candidate Site Comparison Cards
     File: components/comparison_cards/comparison_cards.html
     Role: Multi-candidate evaluation carousel with primary metric cards and
           expandable secondary drop-cards for 360° horizons, slopes, and solar curves.
     ========================================================================== -->

<!-- Top floating corridor container. Responsive boundaries adjust dynamically when
     side drawers slide open. Supports .layout-dropdown (default) and .layout-shelf. -->
<section class="drawer-top-cards layout-dropdown" id="cards-corridor">
  <!-- Corridor Flight Toolbar: Live Site Counter & Undo / Redo Control Deck -->
  <div class="cards-corridor-toolbar">
    <div class="cards-toolbar-left">
      <span class="cards-toolbar-icon">🪐</span>
      <span class="cards-toolbar-title">Candidate Comparison Deck</span>
      <span class="cards-count-badge" id="cards-count-badge">0 Sites</span>
    </div>
    <div class="cards-toolbar-actions">
      <button class="btn-cards-tool" id="btn-cards-undo" title="Undo card action (Ctrl + Z)" disabled>
        <span class="tool-icon">↩</span> Undo
      </button>
      <button class="btn-cards-tool" id="btn-cards-redo" title="Redo card action (Ctrl + Y)" disabled>
        <span class="tool-icon">↪</span> Redo
      </button>
    </div>
  </div>

  <div class="cards-comparison-controls" role="group" aria-label="Compare candidate sites by time window">
    <label class="comparison-date-field">
      <span>From (UTC)</span>
      <input id="comparison-from" type="datetime-local" step="3600">
    </label>
    <label class="comparison-date-field">
      <span>To (UTC, exclusive)</span>
      <input id="comparison-to" type="datetime-local" step="3600">
    </label>
    <button class="btn-cards-tool" id="btn-compare-sites" type="button">Compare</button>
    <span class="comparison-status" id="comparison-status" role="status" aria-live="polite">
      Hourly telemetry is available for November 2026. Roughness, dispersion, and touchdown velocity are not assessed.
    </span>
  </div>

  <div class="carousel-container" id="carousel-track">
    <!-- Clean Slate: Blank Candidate Target Slot -->
    <div class="cards-empty-state" id="cards-empty-slot">
      <div class="site-card card-add-new" id="btn-add-candidate-trigger" title="Drop pin on 3D Moon or press / to search">
        <div class="add-content">
          <div class="add-icon">➕</div>
          <h4>No Candidate Sites in Deck</h4>
          <p>Drop a coordinate pin on the 3D Moon or press <kbd class="kbd-badge" style="padding:1px 5px; background:#333; border:1px solid #555; border-radius:3px; font-size:10px;">/</kbd> to search 21 authentic NASA candidate sites.</p>
        </div>
      </div>
    </div>
  </div>
</section>
